<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><link rel="manifest" href="manifest.webmanifest"><title>ZERO</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f5f6f7;min-height:100svh;display:grid;place-items:center}.app{width:min(94vw,520px);padding:22px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #292e34;padding-bottom:12px;margin-bottom:18px}h1{font-size:42px;letter-spacing:.22em;margin:0;font-weight:850}.sub,.stats{color:#858d96;font-size:12px}.stats{text-align:right;line-height:1.6}.goal{text-align:center;margin:4px 0 18px}.goal strong{display:block;font-size:18px;letter-spacing:.08em}.goal span{font-size:12px;color:#858d96}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.cell{aspect-ratio:1;border:1px solid #30363d;background:#101419;border-radius:13px;position:relative;cursor:pointer;touch-action:manipulation;transition:.12s}.cell:active{transform:scale(.94)}.cell:after{content:'';position:absolute;inset:25%;border-radius:50%;background:#1d2228;border:1px solid #343b43;transition:.15s}.cell.on{border-color:#756a3c;background:#17170f}.cell.on:after{background:#f1d266;border-color:#ffe58a;box-shadow:0 0 19px rgba(241,210,102,.58),0 0 5px rgba(255,255,255,.35)}.cell.hint{outline:2px solid #fff;outline-offset:2px;animation:pulse .8s 2}.cell.cross{border-color:#8b929a}@keyframes pulse{50%{transform:scale(1.06)}}.msg{height:48px;padding-top:13px;text-align:center;color:#b7bdc4;font-size:13px}.bar{display:flex;gap:8px}.bar button{flex:1;padding:13px 8px;border:1px solid #363c43;background:transparent;color:#e8ebed;border-radius:8px;font:650 11px/1 inherit;letter-spacing:.04em}.lesson{margin:17px auto 0;text-align:center;color:#747c85;font-size:11px;line-height:1.45}.intro{position:fixed;inset:0;background:rgba(5,7,9,.97);z-index:10;display:grid;place-items:center;padding:28px}.intro.hidden{display:none}.card{width:min(92vw,430px);text-align:center}.card h2{font-size:30px;letter-spacing:.1em;margin:0 0 12px}.card p{color:#aab0b7;line-height:1.5;margin:0 auto;max-width:340px}.demo{display:grid;grid-template-columns:repeat(3,58px);gap:7px;justify-content:center;margin:28px auto}.d{width:58px;height:58px;border:1px solid #333941;border-radius:12px;position:relative}.d:after{content:'';position:absolute;inset:17px;border-radius:50%;background:#1d2228}.d.on:after{background:#f1d266;box-shadow:0 0 15px rgba(241,210,102,.55)}.d.mark{border-color:#fff}.card button{margin-top:26px;padding:14px 28px;border:0;border-radius:8px;background:#f0f2f3;color:#090b0e;font-weight:850;letter-spacing:.06em}@media(max-width:380px){.app{padding:15px}.grid{gap:7px}}
</style></head><body><div class="intro" id="intro"><div class="card"><h2>ZERO</h2><p><b>Spegni tutte le luci.</b><br>Quando tocchi una casella, lei e le quattro vicine cambiano stato.</p><div class="demo"><span class="d"></span><span class="d on mark"></span><span class="d"></span><span class="d on mark"></span><span class="d on mark"></span><span class="d on mark"></span><span class="d"></span><span class="d on mark"></span><span class="d"></span></div><p>Accesa diventa spenta. Spenta diventa accesa.<br><b>Solo questo.</b></p><button id="start">GIOCA</button></div></div><main class="app"><header class="top"><div><h1>ZERO</h1><div class="sub">spegni tutto.</div></div><div class="stats"><span id="level"></span><br><span id="moves"></span></div></header><div class="goal"><strong>SPEGNI TUTTE LE LUCI</strong><span>ogni tocco inverte la croce +</span></div><section id="grid" class="grid"></section><div id="msg" class="msg"></div><nav class="bar"><button id="restart">RIPETI</button><button id="undo">INDIETRO</button><button id="hint">INDIZIO</button></nav><div id="lesson" class="lesson"></div></main><script>
const N=5;let board=[],startBoard=[],history=[],level=1,moves=0;
const $=s=>document.querySelector(s),idx=(r,c)=>r*N+c;
function affected(i){const r=Math.floor(i/N),c=i%N,a=[i];for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const R=r+dr,C=c+dc;if(R>=0&&R<N&&C>=0&&C<N)a.push(idx(R,C))}return a}
function press(a,i){for(const j of affected(i))a[j]^=1}
function render(){const g=$('#grid');g.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(v?' on':'');b.setAttribute('aria-label',v?'Luce accesa':'Luce spenta');b.onclick=()=>play(i);g.appendChild(b)});$('#level').textContent='LIV '+level;$('#moves').textContent='MOSSE '+moves;$('#lesson').textContent=level<=3?'Livello '+level+': la posizione nasce da '+level+(level===1?' sola mossa.':' mosse.'):'Nessuno stato intermedio: solo acceso / spento.'}
// Livelli iniziali deterministici: insegnano la regola. Poi scramble garantiti risolvibili.
const teaching=[[12],[6,18],[2,12,22],[0,8,16,24],[2,6,12,18,22]];
function makeLevel(){board=Array(25).fill(0);const seq=level<=teaching.length?teaching[level-1]:randomScramble(Math.min(5+Math.floor((level-5)/2),12));for(const i of seq)press(board,i);startBoard=board.slice();history=[];moves=0;$('#msg').textContent=level===1?'Prova a spegnere il pannello.':'';render()}
function randomScramble(k){const s=[],used=new Set;while(s.length<k){const i=Math.floor(Math.random()*25);if(!used.has(i)){used.add(i);s.push(i)}}return s}
function play(i){history.push(board.slice());press(board,i);moves++;$('#msg').textContent='';render();if(board.every(v=>v===0)){const done=level;$('#msg').textContent='ZERO · '+moves+(moves===1?' mossa':' mosse');setTimeout(()=>{level=done+1;makeLevel()},850)}}
// Lights Out 5x5: prova tutte le 32 combinazioni della prima riga e trova una soluzione.
function solve(b){let best=null;for(let mask=0;mask<32;mask++){const a=b.slice(),p=[];for(let c=0;c<5;c++)if(mask>>c&1){press(a,c);p.push(c)}for(let r=1;r<5;r++)for(let c=0;c<5;c++)if(a[idx(r-1,c)]){const i=idx(r,c);press(a,i);p.push(i)}if(a.slice(20).every(v=>v===0)&&(!best||p.length<best.length))best=p}return best||[]}
function hint(){document.querySelectorAll('.cell').forEach(c=>c.classList.remove('hint','cross'));const sol=solve(board);if(!sol.length){$('#msg').textContent=board.every(v=>v===0)?'Sei già a ZERO.':'Nessun indizio disponibile.';return}const i=sol[0],cells=[...document.querySelectorAll('.cell')];cells[i].classList.add('hint');for(const j of affected(i))cells[j].classList.add('cross');$('#msg').textContent='Tocca la casella evidenziata: guarda la croce che cambia.'}
$('#restart').onclick=()=>{board=startBoard.slice();history=[];moves=0;$('#msg').textContent='Livello ripristinato.';render()};$('#undo').onclick=()=>{if(history.length){board=history.pop();moves--;render()}};$('#hint').onclick=hint;$('#start').onclick=()=>{$('#intro').classList.add('hidden');localStorage.setItem('zero03Intro','1')};if(localStorage.getItem('zero03Intro')==='1')$('#intro').classList.add('hidden');makeLevel();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
